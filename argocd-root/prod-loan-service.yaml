apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-loan-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Lghthien/library-gitops.git
    targetRevision: main
    path: loan-service
    helm:
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: library-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

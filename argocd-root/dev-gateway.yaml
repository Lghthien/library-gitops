apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-gateway
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Lghthien/library-gitops.git
    targetRevision: main
    path: gateway
    helm:
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: library-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
